aid: ingresse
name: Ingresse
description: >-
  Ingresse is a Brazilian ticketing-as-a-service (TaaS) platform that powers
  event ticket sales, access control, and the attendee experience for organizers
  and partners. Its public developer platform lets integrators build tools and
  services on top of Ingresse — creating events, selling and validating tickets,
  managing users, and handling payments — through a versioned REST API (v1 and
  v2) authenticated with an individually issued API key. Ingresse publishes
  first-party SDKs for JavaScript/Node, Android, iOS, and PHP, plus message-queue
  libraries, and hosts its reference documentation on a ReadMe developer portal.
  Ingresse is backed by 500 Global.
